<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5cb85c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Baby Craft</title>
  <!-- 옛 윈도우 10 에 없는 이모지(🪵 🪨 등 새 이모지)만 Noto 이모지 글꼴로 채운다 (그 글자들만 받는다) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap&text=%F0%9F%AA%B5%F0%9F%AA%A8%F0%9F%AA%93%F0%9F%9F%AB%F0%9F%A4%8D%F0%9F%A6%9B%F0%9F%A6%98%F0%9F%A7%B1%F0%9F%A7%B5%F0%9F%9B%A1%F0%9F%A6%94%F0%9F%A5%A9">
  <!-- 시작 화면 로고용 픽셀 글꼴 (로고 글자만 받는다) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap&text=BABYCRAFT">
  <link rel="stylesheet" href="style.css?v=53">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 상단 HUD: 체력 + 인벤토리 -->
  <div id="hud">
    <div class="hud-row">
      <div id="hearts" class="hearts"></div>
      <button id="btn-bag" class="bag-btn" aria-label="items">🎒</button>
    </div>
  </div>

  <!-- 왼쪽 위: 🏠 처음 화면으로 + 방 번호 -->
  <div class="top-left">
    <button id="btn-home" class="home-btn" aria-label="home">🏠</button>
    <div id="room-badge" class="room-badge hidden"></div>
    <button id="btn-buddy" class="home-btn buddy-btn" aria-label="play buddy">🤝<span>놀아주기</span></button>
    <button id="btn-voice" class="home-btn voice-btn on" aria-label="read chat aloud">🗣️<span>음성 ON</span></button>
    <button id="btn-words" class="home-btn voice-btn on" aria-label="word cards on/off">📖<span>단어 ON</span></button>
    <button id="btn-volume" class="home-btn voice-btn vol-btn" aria-label="volume">🔉<span>소리</span></button>
  </div>
  <!-- 🔉 소리 크기: - 막대 + -->
  <div id="volume-pop" class="volume-pop hidden">
    <button class="vol-down" aria-label="quieter">🔈</button>
    <div class="vol-bar"><div class="vol-fill"></div></div>
    <button class="vol-up" aria-label="louder">🔊</button>
    <b class="vol-num"></b>
  </div>

  <!-- 🏠 를 눌렀을 때 한 번 묻기 -->
  <div id="home-confirm" class="overlay hidden">
    <div class="confirm-box">
      <div class="confirm-q">🏠❓</div>
      <div id="home-confirm-text" class="confirm-text"></div>
      <div class="confirm-btns">
        <button id="btn-home-yes" class="big-btn" aria-label="yes">✅</button>
        <button id="btn-home-no" class="big-btn" aria-label="no">❌</button>
      </div>
    </div>
  </div>
  <!-- 🤝 놀아주기: 누구랑 놀아줄까요? -->
  <div id="buddy-pick" class="overlay hidden">
    <div class="confirm-box">
      <div class="confirm-q">🤝</div>
      <div id="buddy-pick-text" class="confirm-text"></div>
      <div id="buddy-pick-names" class="buddy-names"></div>
      <div class="confirm-btns">
        <button id="btn-buddy-yes" class="big-btn" aria-label="ok">✅</button>
        <button id="btn-buddy-no" class="big-btn" aria-label="cancel">❌</button>
      </div>
    </div>
  </div>
  <canvas id="minimap" class="minimap hidden"></canvas>
  <!-- 작은 지도 오른쪽 아래 ?: 단축키 설명 -->
  <button id="btn-help" class="help-btn" aria-label="help">?</button>
  <div id="help-panel" class="help-panel hidden"></div>

  <div id="faint" class="faint hidden"></div>

  <!-- 터치 조작: 가상 조이스틱 + 액션 버튼 -->
  <div id="controls">
    <div id="joystick-zone">
      <div id="joy-base"><div id="joy-knob"></div></div>
    </div>
    <button id="btn-weapon" class="big-btn" aria-label="change weapon">⚔️</button>
    <button id="btn-action" class="big-btn" aria-label="action">✋</button>
    <div id="pouch" class="pouch"></div>
    <button id="btn-jump" class="big-btn side-btn" aria-label="jump">🦘</button>
    <!-- 💬 대화: 같은 서버 사람들이 한 말 (최근 3줄). 누르면 넓은 대화 창 -->
    <div id="chat-bar" class="chat-bar">
      <div id="chat-box" class="chat-box" role="button" aria-label="chat"></div>
      <button id="btn-talk" class="big-btn side-btn" aria-label="talk">💬</button>
    </div>
  </div>
  <div id="bag-panel" class="bag-panel hidden"></div>
  <div id="talk-panel" class="weapon-picker talk-panel hidden"></div>

  <div id="toast-layer"></div>

  <!-- 단어 카드 -->
  <div id="card-overlay" class="overlay hidden">
    <div id="card" class="card">
      <div id="card-reveal" class="reveal"></div>
      <div id="card-word" class="word"></div>
      <div id="card-heard" class="heard"></div>
      <div id="card-praise" class="praise"></div>
      <div id="card-follow" class="follow hidden"></div>
      <div class="card-buttons">
        <button id="btn-speaker" class="big-btn" aria-label="listen">🔊</button>
        <div id="mic" class="mic" data-state="idle">🎤</div>
        <button id="btn-pass" class="big-btn hidden" aria-label="done">✅</button>
      </div>
      <div id="card-status" class="status"></div>
    </div>
  </div>

  <!-- 제작대 (집 안) -->
  <div id="craft-overlay" class="overlay hidden">
    <div class="craft">
      <div class="craft-head">
        <span class="craft-title">🏠 🔨</span>
        <button id="btn-craft-close" class="big-btn" aria-label="close">🚪</button>
      </div>
      <div id="recipes" class="recipes"></div>
    </div>
  </div>


  <div id="stars" class="stars"></div>

  <!-- 시작 화면 -->
  <div id="title" class="overlay">
    <!-- 배경: 게임 그림체의 하늘/언덕/땅 + 캐릭터가 몬스터를 무찌르는 장면 (TitleScene) -->
    <div class="title-bg" aria-hidden="true"><canvas id="title-scene"></canvas></div>
    <h1 class="logo"><span class="logo-1">BABY</span><span class="logo-2">CRAFT</span></h1>
    <div class="logo-emoji" aria-hidden="true"><span>🪵</span><span>🪨</span><span>🗡️</span><span>🍎</span><span>💎</span></div>
    <div class="title-card">
    <input id="name-input" class="name-input" placeholder="이름" autocomplete="off" aria-label="name">
    <div id="gender-pick" class="gender-pick">
      <button class="gender-btn" data-g="m" aria-label="boy">👦</button>
      <button class="gender-btn" data-g="f" aria-label="girl">👧</button>
    </div>
    <div class="title-buttons">
      <div class="look-picker">
        <canvas id="look-preview" class="look-preview"></canvas>
        <button id="btn-look" class="big-btn look" aria-label="change look">🎨</button>
      </div>
      <button id="btn-start" class="big-btn start" disabled aria-label="start">▶</button>
      <button id="btn-multi" class="big-btn multi" disabled aria-label="two players">👥</button>
      <button id="btn-new" class="big-btn new-world hidden" aria-label="new world">🌱</button>
    </div>
    </div>
    <!-- 원격 여럿이 하기: 한 기기는 🏠 방 만들기, 다른 기기들은 번호 입력 후 ▶ -->
    <div id="mp-panel" class="mp-panel hidden">
      <button id="btn-host" class="big-btn" aria-label="make room">🏠</button>
      <span class="mp-or">|</span>
      <input id="mp-code" class="mp-code" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="room number">
      <button id="btn-join" class="big-btn" aria-label="join">▶</button>
      <div id="mp-msg" class="mp-msg"></div>
      <div id="mp-note" class="mp-note"></div>
    </div>
    <p id="title-msg" class="msg"></p>
  </div>

  <script>
    // 채널 서버(?server=)는 game.js 가 깨져서 못 켜지면 1분 뒤 다시 불러온다 (고친 것이 오면 저절로 살아난다)
    if (/[?&]server=/.test(location.search)) {
      window.addEventListener('error', e => {
        if (window.__retry || typeof Game !== 'undefined') return; // 게임이 켜진 뒤의 오류는 그대로 둔다
        console.log('[Server] 게임을 못 불러옴, 1분 뒤 다시', e.message);
        window.__retry = setTimeout(() => location.reload(), 60000);
      });
    }
  </script>
  <script src="game.js?v=131"></script>
</body>
</html>
